---
title: Root Playbook File
description: Runs all of the Playbook files
actions:
  # some changes requires default user access. loading the hive before everything else is required
  - !powerShell:
    command: 'reg load HKU\AME_UserHive_Default C:\Users\Default\NTUSER.DAT'
    oobe: false
    wait: true

  # Pre-flight: kill known VC-runtime lockers (#1509), validate build, warn on pending reboot
  - !task: { path: 'atlas\preflight.yml' }

  - !writeStatus: { status: "Deleting old AtlasOS folders" }
  - !powerShell:
    command: '.\STOPFOLDERPROC.ps1'
    exeDir: true
    onUpgrade: true
    wait: true
    runas: currentUserElevated
  - !powerShell:
    command: |
      $windir = [Environment]::GetFolderPath('Windows')
      Remove-Item -LiteralPath "$windir\AtlasDesktop" -Force -Recurse
      Remove-Item -LiteralPath "$windir\AtlasModules" -Force -Recurse
    wait: true
    exeDir: true
    oobe: false
    onUpgrade: true

  - !writeStatus: { status: "Copying files" }
  - !powerShell:
    command: |
      $windir = [Environment]::GetFolderPath('Windows')
      @(
          'AtlasModules',
          'AtlasDesktop'
      ) | ForEach-Object {
          if (!(Test-Path $_)) { exit 1 }
          Copy-Item -Path $_ -Destination $windir -Force -Recurse
          if (!$?) { exit 2 }
      }
      Start-Process -FilePath """$windir\AtlasDesktop\6. Advanced Configuration\Process Explorer\Uninstall Process Explorer.cmd""" -ArgumentList "/silent" -WindowStyle Hidden
      Copy-Item -Path 'Themes\*' -Destination """$windir\Resources\Themes""" -Force -Recurse
      # Ensure Logs/Other dirs exist for Atlas module/diagnostics
      $logs = "$windir\AtlasModules\Logs"
      $other = "$windir\AtlasModules\Other"
      foreach ($d in @($logs, $other)) { if (!(Test-Path $d)) { New-Item -Path $d -ItemType Directory -Force | Out-Null } }
    weight: 10
    wait: true
    exeDir: true
    handleExitCodes: { "!0": halt }

  # Initialise the Atlas shared library (logging, helpers, safe registry calls)
  - !task: { path: 'atlas\init-libraries.yml' }

  # Persist the user's profile radio selection (balanced/performance/privacy/security)
  # so later tweaks can read HKLM:\SOFTWARE\AtlasOS\Profile\Current
  - !task: { path: 'atlas\set-profile.yml' }

  # Apply profile-driven defaults for NEW options (gaming/AI/enterprise hardening)
  # that don't have dedicated legacy radio pages. User selections on subsequent
  # pages override these writes because their own steps run later.
  - !task: { path: 'atlas\profile-defaults.yml' }

  # Prevent annoying notifications during deployment
  - !cmd:
    command: "DISABLENOTIFS.cmd"
    exeDir: true
    wait: true
    runas: currentUserElevated
  - !taskKill: { name: "explorer" }
  - !taskKill: { name: "ShellExperienceHost" }
  - !run: { exe: "explorer.exe", runas: "currentUser", wait: false }

  # Configure PowerShell first so that other PowerShell scripts work
  # NGEN - .NET assemblies PowerShell optimization
  - !writeStatus: { status: "Optimizing PowerShell" }
  - !task: { path: 'tweaks\scripts\script-ngen.yml' }
  - !task: { path: 'tweaks\qol\config-powershell.yml' }

  # Disk Cleanup is run first so it can run in the background
  - !writeStatus: { status: "Cleaning up" }
  - !powerShell:
    command: '.\CLEANUP.ps1'
    exeDir: true
    wait: true
    runas: currentUserElevated

  # Set hidden Settings pages
  # Done before everything else as scripts will overwrite it
  - !task: { path: 'tweaks\qol\set-hidden-settings-pages.yml' }

  # Main tasks
  - !task: { path: 'atlas\start.yml' }
  - !task: { path: 'atlas\services.yml' }
  - !task: { path: 'atlas\components.yml' }
  - !task: { path: 'atlas\appx.yml' }
  - !task: { path: 'atlas\repair-store.yml' }
  - !task: { path: 'atlas\default.yml' }
  - !task: { path: 'atlas\revert.yml' }
  - !task: { path: "tweaks.yml" }

  # Set hives to HKU default user
  - !writeStatus: { status: "Applying hives..." }
  - !powerShell:
    command: '.\APPLYDUHIVE.ps1'
    exeDir: true
    wait: true
    runas: currentUserElevated

  # Set all the correct paths if there are incorrect ones in the registry
  - !writeStatus: { status: "Cleaning up registry paths" }
  - !powerShell:
    command: '.\SETPATHS.ps1'
    exeDir: true
    wait: true
    runas: currentUserElevated

  # Unloading the hive
  - !powerShell:
    command: 'reg unload HKU\AME_UserHive_Default'
    oobe: false
    wait: true

  # Set PowerShell execution policy to RemoteSigned from the previous "Unrestricted"
  # This allows Atlas folder scripts (local) to run while requiring signatures for downloaded scripts
  - !writeStatus: { status: "Securing PowerShell execution policy" }
  - !registryValue:
    path: 'HKLM\SOFTWARE\Microsoft\PowerShell\1\ShellIds\Microsoft.PowerShell'
    value: 'ExecutionPolicy'
    data: 'RemoteSigned'
    type: REG_SZ

  # Post-install health check (writes a JSON report to AtlasModules\Logs; non-blocking)
  # When healthy pops a toast; when warnings are found writes them to the desktop.
  - !writeStatus: { status: "Running post-install health check" }
  - !powerShell:
    command: |
      $windir = [Environment]::GetFolderPath('Windows')
      $hp = "$windir\AtlasModules\Scripts\Health\Start-AtlasHealthCheck.ps1"
      $toast = "$windir\AtlasModules\Scripts\Health\Show-AtlasToast.ps1"
      $report = $null
      if (Test-Path $hp) {
          try {
              $report = & $hp -ExportReport -PassThru -ErrorAction SilentlyContinue
          } catch {}
      }
      $title = 'AtlasOS installed'
      if ($report -and $report.Failed -gt 0) {
          $msg = "Install complete, but $($report.Failed) health check(s) failed. Report exported to AtlasModules\Logs."
      } elseif ($report -and $report.Warnings -gt 0) {
          $msg = "Install complete with $($report.Warnings) warning(s). See AtlasModules\Logs for details."
      } else {
          $msg = 'Installation finished. See the Atlas folder on your Desktop to start exploring.'
      }
      if (Test-Path $toast) {
          & $toast -Title $title -Message $msg -ErrorAction SilentlyContinue
      }
    wait: true
    runas: currentUserElevated
