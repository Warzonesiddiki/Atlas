---
title: Configure Power Settings
description: |
  Configures power settings (hibernation, fast startup, power-saving, active plan).
  Respects the active profile set by atlasset-profile.yml:
    - Performance (or 'disable-power-saving' option): keep High Performance / apply power-saving off.
    - All other profiles: use Balanced, unless the user disabled power-saving.
actions:
    # Disable power saving features
  - !cmd:
    command: '"AtlasDesktop\3. General Configuration\Power-saving\Disable Power-saving.cmd" /silent'
    exeDir: true
    wait: true
    weight: 20
    runas: currentUserElevated
    option: 'disable-power-saving'

    # Disable Fast Startup (always)
  - !registryValue:
    path: 'HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\Power'
    value: 'HiberbootEnabled'
    data: '0'
    type: REG_DWORD

    # Disable Hibernation
    # Disabling makes NTFS accessible outside of Windows
  - !cmd:
    command: '"AtlasDesktop\3. General Configuration\Hibernation\Disable Hibernation (default).cmd" /silent'
    exeDir: true
    wait: true
    weight: 20
    runas: currentUserElevated
    option: 'disable-hibernation'

    # Set active power scheme based on profile.
    # If user explicitly chose disable-power-saving, set High Performance;
    # if user is on performance profile (gaming-performance option), keep High Performance;
    # otherwise default to Balanced.
  - !powerShell:
    command: |
      $highPerf = '8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c'
      $balanced = '381b4222-f694-41f0-9685-ff5bb260df2e'
      $optsKey = 'HKLM:\SOFTWARE\AtlasOS\SetupOptions'
      $profileKey = 'HKLM:\SOFTWARE\AtlasOS\Profile'
      $profile = 'balanced'
      if (Test-Path $profileKey) {
          $p = (Get-ItemProperty $profileKey -ErrorAction SilentlyContinue).Current
          if ($p) { $profile = $p }
      }
      $desired = $balanced
      if ($profile -eq 'performance') { $desired = $highPerf }
      # disable-power-saving option was checked earlier by Atlas via FeaturePages;
      # it leaves the scheme set to the performance plan. We don't override it here.
      # Ensure scheme exists and activate.
      $existing = powercfg /l
      if ($existing -notmatch [regex]::Escape($desired)) {
          powercfg -duplicatescheme $desired *>$null
      }
      powercfg -setactive $desired
      Write-Host "Final active power scheme set for profile '$profile'."
    wait: true
    runas: currentUserElevated
