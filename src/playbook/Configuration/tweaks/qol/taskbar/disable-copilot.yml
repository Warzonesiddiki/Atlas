---
title: Disable Microsoft Copilot (taskbar button)
description: |
  Hides the Copilot taskbar button by default. Removal of the Copilot app and
  AI feature set is handled by `tweaks\ai\disable-copilot-app.yml` when the
  'disable-copilot' / 'disable-ai' options are selected.
builds: [ '>=22000' ]
actions:
  - !registryValue:
    path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
    value: 'ShowCopilotButton'
    data: '0'
    type: REG_DWORD
    
