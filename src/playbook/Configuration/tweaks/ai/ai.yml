---
title: AI feature tweaks
description: |
  Applies AI-related privacy and resource-use tweaks. On non-Copilot+ PCs
  each individual tweak no-ops safely. Gated behind the 'disable-ai' option
  by default; individual Copilot removal is also offered as a standalone option.
appliesTo:
  minBuild: 26100
sources:
  - https://learn.microsoft.com/en-us/windows/ai/
  - https://learn.microsoft.com/en-us/windows/privacy/manage-windows-11-copilot
actions:
  - !writeStatus: {status: 'Running AI feature tweaks', option: 'disable-ai'}
  - !task: {path: 'disable-recall.yml', option: 'disable-ai'}
  - !task: {path: 'disable-click-to-do.yml', option: 'disable-ai'}
  - !task: {path: 'disable-ai-image-features.yml', option: 'disable-ai'}
  - !task: {path: 'disable-copilot-app.yml', option: 'disable-copilot'}
  - !task: {path: 'disable-windowsaifabric.yml', option: 'disable-ai'}
  - !task: {path: 'disable-ai-actions.yml', option: 'disable-ai'}
