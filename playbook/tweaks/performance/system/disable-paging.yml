---
title: Disable Paging Executive
description: |
  Disables memory paging of the kernel (DisablePagingExecutive) and page
  combining. Disabled by default due to micro-stutter reports on low-RAM
  systems (issue #1406). This is ONLY enabled in the Performance profile
  and requires the 'gaming-performance' option. It is NOT applied in Balanced,
  Privacy, or Security. Re-enable with the matching Rollback script.
appliesTo:
  minBuild: 22000
sources:
  - https://learn.microsoft.com/en-us/windows/win32/memory/memory-management-registry-keys
actions:
  - !writeStatus: {status: 'Disabling kernel paging (performance profile only)', option: 'gaming-performance'}
  - !registryValue:
    path: 'HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\Memory Management'
    value: 'DisablePagingExecutive'
    data: '1'
    type: REG_DWORD
    option: 'gaming-performance'
  - !registryValue:
    path: 'HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\Memory Management'
    value: 'DisablePageCombining'
    data: '1'
    type: REG_DWORD
    option: 'gaming-performance'
