---
title: Defender Attack Surface Reduction (ASR) Rules
description: |
  Enables the low-false-positive subset of Windows Defender Attack Surface
  Reduction rules in block mode. Applied only in the Security-Focused profile.
  Rules that commonly cause issues with consumer software (e.g. Adobe signed
  binary injection) are left in audit mode.
sources:
  - https://learn.microsoft.com/en-us/microsoft-365/security/defender-endpoint/attack-surface-reduction-rules-reference
appliesTo:
  minBuild: 22000
actions:
  - !writeStatus: {status: 'Configuring Defender ASR rules (low-FP block + audit)'}
  - !powerShell:
    command: |
      $rules = @{
        # Block abuse of exploited vulnerable signed drivers
        '56a863a9-875e-4185-98a7-b882c64b5ce5' = 'Block'
        # Block Adobe Reader from creating child processes
        '7674ba52-37eb-4a4f-a9a1-f0f9a1619a2c' = 'Audit'
        # Block all Office applications from creating child processes
        'd4f940ab-401b-4efc-aadc-ad5f3c50688a' = 'Block'
        # Block Office applications from injecting code
        '75668c1f-73b5-4cf0-93b0-fc75ef9d2b95' = 'Audit'
        # Block Win32 API calls from Office macro
        '92e97fa1-2edf-4476-bdd6-9dd0b4dddc7b' = 'Block'
        # Block execution of potentially obfuscated scripts
        '5beb7efe-fd9a-4556-801d-275e5ffc04cc' = 'Block'
        # Block executable content from email/webdav
        'be9ba2d9-53ea-4cdc-84e5-9b1eeee46550' = 'Block'
        # Block credential stealing from LSASS
        '9e6c4e1f-7d60-472f-ba1a-a39ef669e4b2' = 'Audit'
        # Block process creations from PSExec/WMI commands
        'd1e49aac-8f56-4280-b9ba-993a6d77406c' = 'Audit'
        # Block untrusted/signed USB processes run from USB
        'b2b3f03d-6a65-4f7b-a9c7-1c7ef74a9ba4' = 'Block'
      }
      foreach ($id in $rules.Keys) {
        $action = $rules[$id]
        Add-MpPreference -AttackSurfaceReductionRules_Ids $id -AttackSurfaceReductionRules_Actions $action -ErrorAction SilentlyContinue
      }
    wait: true
    runas: currentUserElevated
